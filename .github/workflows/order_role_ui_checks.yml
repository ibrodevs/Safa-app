name: Order role UI checks

on:
  pull_request:
    branches: [main]
    paths:
      - lib/core/router/app_router.dart
      - lib/features/carrier_module/**
      - lib/features/main_module/map/**
      - lib/features/main_module/payments/**
      - lib/features/main_module/profile/**
      - test/order_role_map_notifications_contract_test.dart
      - test/delivery_point_compact_route_test.dart
      - test/nearby_shipment_display_test.dart
      - test/notification_role_ui_contract_test.dart
      - test/carrier_market_map_viewport_contract_test.dart
      - test/order_summary_price_source_contract_test.dart
      - test/specialist_order_card_contract_test.dart
      - .github/workflows/order_role_ui_checks.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-order-map-notifications-ui
          fetch-depth: 0
      - name: Remove obsolete order chip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/features/carrier_module/home/carrier_home_screen.dart')
          source = path.read_text()
          pattern = re.compile(
              r'\nclass _Chip extends StatelessWidget \{.*?\n\}\n\nclass _StopUi',
              re.S,
          )
          updated, count = pattern.subn('\nclass _StopUi', source, count=1)
          if count:
              path.write_text(updated)
          PY
      - name: Commit source cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup needed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/carrier_module/home/carrier_home_screen.dart
            git commit -m "Remove obsolete specialist order chip"
            git push origin HEAD:agent/unify-order-map-notifications-ui
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: >-
          flutter test
          test/order_role_map_notifications_contract_test.dart
          test/delivery_point_compact_route_test.dart
          test/nearby_shipment_display_test.dart
          test/notification_role_ui_contract_test.dart
          test/carrier_market_map_viewport_contract_test.dart
          test/order_summary_price_source_contract_test.dart
          test/specialist_order_card_contract_test.dart
