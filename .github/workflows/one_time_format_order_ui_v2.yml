name: Apply final order UI formatting

on:
  push:
    branches:
      - agent/unify-order-map-notifications-ui
    paths:
      - .github/workflows/one_time_format_order_ui_v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-order-map-notifications-ui
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Fix and format
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/features/carrier_module/home/carrier_home_screen.dart')
          s = p.read_text()
          old = """    final latPadding =
        (bounds.north - bounds.south).abs().clamp(0.002, 0.03) * 0.2;
    final lonPadding =
        (bounds.east - bounds.west).abs().clamp(0.002, 0.03) * 0.2;
"""
          new = """    final latPadding =
        (bounds.north - bounds.south).abs().clamp(0.002, 0.03).toDouble() *
        0.2;
    final lonPadding =
        (bounds.east - bounds.west).abs().clamp(0.002, 0.03).toDouble() *
        0.2;
"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif '.clamp(0.002, 0.03).toDouble()' not in s:
              raise SystemExit('viewport padding block not found')
          PY
          dart format lib test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nothing to commit"
          else
            git add lib test
            git commit -m "Format unified order UI changes"
            git push origin HEAD:agent/unify-order-map-notifications-ui
          fi
