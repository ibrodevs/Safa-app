name: Fix order UI syntax

on:
  push:
    branches: [agent/unify-order-map-notifications-ui]
    paths: [.github/workflows/fix_order_ui_syntax.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-order-map-notifications-ui
          fetch-depth: 0
      - name: Fix source
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('lib/features/main_module/profile/view/components/profile_notifications_screen.dart')
          s = p.read_text()
          bad = """                    ),
                      ),
                    ],
                  ],
                ),
"""
          good = """                    ),
                  ],
                ),
"""
          assert bad in s
          p.write_text(s.replace(bad, good, 1))

          p = Path('lib/features/carrier_module/home/carrier_home_screen.dart')
          s = p.read_text()
          old = """    final latPadding =
        (bounds.north - bounds.south).abs().clamp(0.002, 0.03) * 0.2;
    final lonPadding =
        (bounds.east - bounds.west).abs().clamp(0.002, 0.03) * 0.2;
"""
          new = """    final latPadding =
        (bounds.north - bounds.south).abs().clamp(0.002, 0.03).toDouble() * 0.2;
    final lonPadding =
        (bounds.east - bounds.west).abs().clamp(0.002, 0.03).toDouble() * 0.2;
"""
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif '.clamp(0.002, 0.03).toDouble()' not in s:
              raise SystemExit('viewport padding block not found')
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/main_module/profile/view/components/profile_notifications_screen.dart lib/features/carrier_module/home/carrier_home_screen.dart
          git commit -m "Fix notification card syntax and map padding types"
          git push origin HEAD:agent/unify-order-map-notifications-ui
