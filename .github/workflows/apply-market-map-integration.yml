name: Apply market map integration

on:
  push:
    branches:
      - agent/market-map-layers
    paths:
      - tool/apply_market_map_patch.py
      - .github/workflows/apply-market-map-integration.yml
  pull_request:
    branches:
      - main
    paths:
      - tool/apply_market_map_patch.py
      - .github/workflows/apply-market-map-integration.yml
      - lib/features/main_module/map/**
      - test/market_map_layers_test.dart

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/market-map-layers
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply safe source patch
        run: python tool/apply_market_map_patch.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: dart format lib/features/main_module/map test/market_map_layers_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run map tests
        run: flutter test test/market_map_layers_test.dart test/route_payload_test.dart

      - name: Commit integrated map layers
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/main_module/map/view/map_screen.dart \
                  lib/features/main_module/map/data/model/market_map_feature.dart \
                  lib/features/main_module/map/data/repo/market_map_repository.dart \
                  lib/features/main_module/map/view/widgets/market_map_layers.dart \
                  test/market_map_layers_test.dart
          git commit -m "integrate published market map layers"
          git push origin HEAD:agent/market-map-layers
