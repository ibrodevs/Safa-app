name: One-time unified order UI refactor

on:
  push:
    branches:
      - agent/unify-order-map-notifications-ui
    paths:
      - .github/workflows/one_time_order_ui_refactor.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry one-time unified order UI refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unify-order-map-notifications-ui
          fetch-depth: 0
      - name: Apply refactor
        run: python .github/scripts/apply_order_ui_refactor.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test/order_role_map_notifications_contract_test.dart
          git commit -m "Unify order cards maps and notification UI"
          git push origin HEAD:agent/unify-order-map-notifications-ui
