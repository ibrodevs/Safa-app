name: dogo
description: DoGo

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.9
  infinite_carousel: ^1.1.1
  lottie: ^3.3.1
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.0

  go_router: ^14.0.2

  path_provider: ^2.1.4
  intl: ^0.20.2
  logger: ^2.6.0
  pull_to_refresh: ^2.0.0
  uuid: ^4.5.1
  http: ^1.4.0
  web_socket_channel: ^2.4.0
  provider: ^6.0.5
  dio: ^5.9.0
  url_launcher: ^6.3.0
  app_links: ^6.3.2

  shared_preferences: ^2.4.0
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  permission_handler: ^11.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_messaging: 15.2.10
  firebase_core: 3.15.2
  firebase_auth: ^5.2.0
  flutter_localization: ^0.3.3

  geolocator: 14.0.2
  connectivity_plus: ^6.0.3
  internet_connection_checker: ^3.0.1
  pretty_dio_logger: ^1.4.0
  share_plus: ^12.0.1

  yandex_maps_mapkit_lite:
    version: ^4.25.0-beta

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/Gilroy-SemiboldItalic.ttf
          weight: 600
        - asset: assets/fonts/Gilroy-Semibold.ttf
          weight: 600
    - family: SFProText
      fonts:
        - asset: assets/fonts/SFProText-Light.ttf
          weight: 300
        - asset: assets/fonts/SFProText-Regular.ttf
          weight: 400
        - asset: assets/fonts/SFProText-Medium.ttf
          weight: 500
        - asset: assets/fonts/SFProText-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SFProText-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.jpg
